[project]
name = "prediction-engine"
version = "0.1.0"
description = "Predicts questions for Udvash weekly exams (Bangladesh, HSC admission prep)"
requires-python = ">=3.11"
dependencies = [
    "lxml",
    "pydantic>=2.0",
    "requests",
    "httpx",
    "PyMuPDF",
    "selectolax",
    "chromadb",
    "sentence-transformers",
    "scikit-learn",
    "rapidfuzz",
    "pytest",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
